name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements.txt
            agent/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r orchestrator/requirements.txt -r agent/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
