name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements.txt
            agent/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # --only-binary=:all: interdit tout build depuis source (sdist) :
        # évite la compilation Cython de PyYAML 6.0.x (AttributeError
        # 'build_ext' has no attribute 'cython_sources'). Toutes les deps
        # (fastmcp, mcp, etc.) disposent de wheels.
        run: "pip install --only-binary=:all: -r orchestrator/requirements.txt -r agent/requirements.txt -r requirements-dev.txt"

      - name: Run tests
        run: python -m pytest -q
